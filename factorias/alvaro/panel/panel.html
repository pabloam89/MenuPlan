<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de la factoría</title>
<style>
  :root {
    --fondo: #f6f6f3; --tarjeta: #ffffff; --texto: #1d1d1b; --suave: #5f5f58; --linea: #dcdcd4;
    --ok: #1f7a3d; --ok-fondo: #e3f3e8; --mal: #b3261e; --mal-fondo: #fbe4e1; --aviso: #8a5a00; --aviso-fondo: #fdf0d2; --gris: #5f5f58; --gris-fondo: #ecece6; --c-jueces: #1a56b8; --c-otros: #a14a00; --c-principal: #4b5563; --sombra: rgba(0,0,0,.3);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #151513; --tarjeta: #1f1f1c; --texto: #ecece6; --suave: #a3a39a; --linea: #3a3a35;
      --ok: #6fd18c; --ok-fondo: #173322; --mal: #ff8a80; --mal-fondo: #3d1b18; --aviso: #f2c25b; --aviso-fondo: #3a2e10; --gris: #a3a39a; --gris-fondo: #2b2b27; --c-jueces: #6cb6ff; --c-otros: #f0a35e; --c-principal: #b6bcc6; --sombra: rgba(255,255,255,.4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 0 0 8px; }
  h3 { font-size: 1rem; margin: 16px 0 6px; }
  section { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 10px; padding: 14px 16px; margin: 14px 0; }
  p, li { margin: 4px 0; }
  .suave { color: var(--suave); font-size: .88rem; }
  .franja { border-radius: 8px; padding: 10px 12px; margin: 8px 0; border: 1px solid; font-weight: 500; }
  .franja.mal { background: var(--mal-fondo); color: var(--mal); border-color: var(--mal); }
  .franja.ok { background: var(--ok-fondo); color: var(--ok); border-color: var(--ok); }
  .franja.aviso { background: var(--aviso-fondo); color: var(--aviso); border-color: var(--aviso); }
  .franja ul { margin: 6px 0 0; padding-left: 20px; font-weight: 400; overflow-wrap: anywhere; }
  /* sombras en el borde que tenga más tabla por deslizar (truco de fondos local/scroll) */
  .tabla { overflow-x: auto; background: linear-gradient(to right, var(--tarjeta) 30%, transparent) left / 40px 100% no-repeat local, linear-gradient(to left, var(--tarjeta) 30%, transparent) right / 40px 100% no-repeat local, radial-gradient(farthest-side at 0 50%, var(--sombra), transparent) left / 12px 100% no-repeat scroll, radial-gradient(farthest-side at 100% 50%, var(--sombra), transparent) right / 12px 100% no-repeat scroll; }
  #aviso { position: sticky; top: 0; z-index: 5; }
  #app.viejo { opacity: .7; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--linea); vertical-align: top; }
  th { color: var(--suave); font-weight: 600; white-space: nowrap; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.resaltada td { background: var(--mal-fondo); color: var(--mal); font-weight: 600; }
  td ul { margin: 0; padding-left: 18px; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: .85em; overflow-wrap: anywhere; }
  .cifras { display: flex; flex-wrap: wrap; gap: 6px 24px; margin: 6px 0; }
  .cifras div b { display: block; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .vacio { color: var(--suave); font-style: italic; }
  /* v1: lo nuevo son listas apiladas (nada de tablas anchas); el color siempre va con una forma y una palabra */
  main { overflow-anchor: none; } /* el scroll se compensa a mano al entrar filas por arriba */
  .vivo { white-space: nowrap; font-weight: 600; }
  .ok { color: var(--ok); } .aviso { color: var(--aviso); } .mal { color: var(--mal); } .gris { color: var(--gris); } .suave { color: var(--suave); }
  .forma { display: inline-block; min-width: 1.2em; text-align: center; font-weight: 700; }
  .semaforo { padding: 10px 12px; }
  .luces { display: flex; flex-wrap: wrap; gap: 8px; }
  .lampara { flex: 1 1 220px; border: 1px solid; border-radius: 8px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
  .lampara.ok { background: var(--ok-fondo); border-color: var(--ok); } .lampara.aviso { background: var(--aviso-fondo); border-color: var(--aviso); }
  .lampara.mal { background: var(--mal-fondo); border-color: var(--mal); } .lampara.gris { background: var(--gris-fondo); border-color: var(--gris); }
  .lampara .titulo { font-weight: 700; } .lampara .estado { font-weight: 600; } .lampara .detalle { color: var(--texto); flex-basis: 100%; font-size: .9rem; }
  ul.directo, ul.ramas { list-style: none; margin: 6px 0 0; padding: 0; }
  .fila { display: flex; flex-wrap: wrap; gap: 0 8px; padding: 5px 6px; border-bottom: 1px solid var(--linea); border-left: 4px solid transparent; align-items: baseline; }
  .fila.enlazada { border-left-color: currentColor; background: var(--fondo); }
  .fila .hora { font-variant-numeric: tabular-nums; color: var(--suave); }
  .fila .tipo { font-weight: 600; } .fila .detalle { color: var(--texto); overflow-wrap: anywhere; flex: 1 1 14em; }
  .crono { font-variant-numeric: tabular-nums; font-weight: 700; }
  .rama { padding: 8px 0; border-bottom: 1px solid var(--linea); }
  .rama-cab { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; }
  .rama-tot { font-variant-numeric: tabular-nums; color: var(--suave); }
  .marcas { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .marca { border: 1px solid currentColor; border-radius: 6px; padding: 1px 6px; display: inline-flex; gap: 4px; align-items: baseline; min-width: 2em; justify-content: center; }
  .marca.antigua { border-style: dashed; opacity: .75; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .reparto { font-weight: 700; font-size: 1.05rem; }
  .grafico svg { width: 100%; max-width: 560px; height: auto; display: block; }
  .grafico text { fill: var(--texto); font-size: 11px; font-variant-numeric: tabular-nums; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0; }
  .sw { display: inline-block; width: 18px; height: 12px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--linea); }
  .sw-jueces { background: repeating-linear-gradient(45deg, var(--c-jueces) 0 3px, var(--tarjeta) 3px 5px); }
  .sw-otros { background: radial-gradient(var(--tarjeta) 1.3px, var(--c-otros) 1.4px) 0 0 / 6px 6px; }
  .sw-principal { background: repeating-linear-gradient(0deg, var(--c-principal) 0 3px, var(--tarjeta) 3px 4px); }
  caption { text-align: left; padding: 4px 0; }
  @media (max-width: 480px) { main { padding: 10px; } section { padding: 10px 12px; } .fila .detalle { flex-basis: 100%; } }
</style>
</head>
<body>
<main>
  <h1>Panel de la factoría</h1>
  <p class="suave">Solo lee tus ficheros de Claude Code. No manda nada fuera del PC. Se refresca solo cada 5 s. <span id="vivo" class="vivo"></span></p>
  <div id="aviso"></div>
  <div id="app"><p class="vacio">Cargando…</p></div>
</main>
<script>
"use strict";
// Todo lo que viene de los datos entra como texto (append de cadenas), nunca como HTML: lo que se ve no puede ejecutar nada.
const app = document.getElementById("app");
const aviso = document.getElementById("aviso");

function el(tag, clase, ...hijos) {
  const e = document.createElement(tag);
  if (clase) e.className = clase;
  for (const h of hijos) if (h !== null && h !== undefined && h !== false) e.append(h);
  return e;
}
const nf = new Intl.NumberFormat("es-ES");
// La página solo pinta lo que le dan: lo que no se pudo leer llega null desde el servidor y aquí sale «sin dato».
const SD = "sin dato";
const fNum = (n) => (n == null ? SD : nf.format(n));
function msTexto(ms) {
  if (ms < 1000) return `${Math.round(ms)} ms`;
  if (ms < 60000) return `${(ms / 1000).toFixed(1).replace(".", ",")} s`;
  if (ms < 3600000) return `${Math.floor(ms / 60000)} min ${String(Math.round((ms % 60000) / 1000)).padStart(2, "0")} s`;
  return `${Math.floor(ms / 3600000)} h ${Math.floor((ms % 3600000) / 60000)} min`;
}
const fMs = (ms) => (ms == null ? SD : msTexto(ms));
const fechaTexto = (iso) => new Date(iso).toLocaleString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit" });
const fFecha = (iso) => (iso ? fechaTexto(iso) : SD);
function hace(iso) {
  if (!iso) return "";
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  if (s < 90) return `hace ${s} s`;
  if (s < 5400) return `hace ${Math.round(s / 60)} min`;
  if (s < 129600) return `hace ${Math.round(s / 3600)} h`;
  return `hace ${Math.round(s / 86400)} días`;
}
const haceEl = (iso) => {
  const e = el("span", "", hace(iso));
  e.dataset.ts = iso;
  return e;
};
const fUSD = (n) => (n == null ? SD : "$" + n.toFixed(2));

// cols: [{ t: título, n: numérica, v: (fila) => texto o nodo }]
function tabla(cols, filas, { resaltar } = {}) {
  if (filas === null) return el("p", "vacio", "No se pudo leer (ver franja roja).");
  if (!filas.length) return el("p", "vacio", "Sin datos en esta ventana.");
  const cab = el("tr", "", ...cols.map((c) => el("th", c.n ? "n" : "", c.t)));
  const cuerpo = filas.map((f) => el("tr", resaltar && resaltar(f) ? "resaltada" : "", ...cols.map((c) => el("td", c.n ? "n" : "", c.v(f)))));
  const caja = el("div", "tabla", el("table", "", el("thead", "", cab), el("tbody", "", ...cuerpo)));
  caja.tabIndex = 0; // se puede desplazar con el teclado
  return caja;
}
const cifra = (valor, ...etiqueta) => el("div", "", el("b", "", String(valor)), el("span", "suave", ...etiqueta));
const franja = (clase, titulo, lista) => el("div", "franja " + clase, titulo, lista && lista.length ? el("ul", "", ...lista.map((x) => el("li", "", x))) : null);

let lineaLectura = null;
const textoLectura = (d) => `Lectura: ${msTexto(d.lecturaMs)}${d.ficheros.total === null ? "" : ` de ${d.ficheros.total} ficheros (los que no cambiaron salen de la memoria)`}; el panel pesa ${d.proceso.rssMB} MB. Generado ${fechaTexto(d.generado)}.`;

function pintarEstado(d) {
  const e = d.estado;
  const s = el("section", "", el("h2", "", "Estado"));
  if (d.errores.length) s.append(franja("mal", "No se pudo leer algo: lo que depende de ello sale como «sin dato», no como 0.", d.errores.map((x) => `${x.fuente}: ${x.fichero} — ${x.motivo}`)));
  const c = e.copia;
  if (c === null) s.append(franja("aviso", "No se pudo comparar la copia instalada con el repo (mira los errores de arriba)."));
  else if (c.ok) s.append(franja("ok", "Copia instalada = repo (hooks y lib idénticos por hash)."));
  else {
    const l = [];
    if (c.difieren.length) l.push("Distintos: " + c.difieren.join(", "));
    if (c.faltanInstalada.length) l.push("Faltan en la copia instalada: " + c.faltanInstalada.join(", "));
    if (c.sobranInstalada.length) l.push("Sobran en la copia instalada: " + c.sobranInstalada.join(", "));
    s.append(franja("mal", "Copia instalada ≠ repo: los veredictos del registro pueden ser falsos.", l));
  }
  const ra = e.registroAntiguo;
  if (ra?.aviso) {
    const l = [];
    if (ra.sinAgentId) l.push(`${ra.sinAgentId} de ${ra.apuntes} apuntes sin agent_id (versión vieja del hook)`);
    if (ra.noJueces) l.push(`${ra.noJueces} apuntes de agentes que no son jueces (la versión vieja también apunta a constructores)`);
    s.append(franja("aviso", "Datos del registro de jueces poco fiables: los antiguos pueden traer veredictos falsos.", l));
  }
  s.append(el("div", "cifras", cifra(fFecha(e.ultimoEvento), "último evento visto", ...(e.ultimoEvento ? [" (", haceEl(e.ultimoEvento), ")"] : [])), cifra(fNum(e.sesiones), `sesiones en los últimos ${d.dias} días`), cifra(fNum(e.lineasRotas), "líneas rotas saltadas")));
  lineaLectura = el("p", "suave", textoLectura(d));
  s.append(lineaLectura);
  return s;
}

function pintarHooks(d) {
  const s = el("section", "", el("h2", "", `Qué se activa y qué no (últimos ${d.dias} días)`));
  s.append(
    tabla(
      [
        { t: "Evento", v: (h) => h.evento },
        { t: "Hook", v: (h) => el("span", "", h.nombre, h.ruta ? el("br") : null, h.ruta ? el("code", "suave", h.ruta) : null) },
        { t: "Veces", n: true, v: (h) => fNum(h.veces) },
        { t: "Última", v: (h) => (h.veces === 0 ? "—" : fFecha(h.ultima)) },
        { t: "Media", n: true, v: (h) => (h.veces === 0 ? "—" : fMs(h.mediaMs)) },
        { t: "Máx.", n: true, v: (h) => (h.veces === 0 ? "—" : fMs(h.maxMs)) },
        { t: "Bloqueos", n: true, v: (h) => fNum(h.bloqueos) },
        { t: "Nota", v: (h) => (h.declarado === null ? SD : h.rojo ? "Stop debería anotarse siempre: 0 activaciones vistas" : h.sinHuella ? "sin huella visible (declarado, 0 activaciones vistas)" : h.declarado ? "" : "no está en ~/.claude/settings.json (¿del proyecto?)") },
      ],
      d.hooks,
      { resaltar: (h) => h.rojo },
    ),
  );
  if (d.hooks?.some((h) => h.declarado === null)) s.append(el("p", "suave", "No se puede saber qué hooks están declarados porque settings.json no se pudo leer."));
  s.append(el("p", "suave", "Solo se ven los hooks que Claude Code deja anotados en la transcripción: el resumen de cierre de turno (Stop) y los avisos de «hook correcto» de los demás eventos. «Sin huella visible» no quiere decir que no se activara: solo se ve lo que Claude Code anota, y fuera de Stop casi no anota nada. Solo se pone en rojo en Stop, cuyo resumen sí se anota siempre."));
  return s;
}

function totalTexto(t) {
  if (!t.noCuadra) return fMs(t.totalMs) + (t.fotoAtrasada ? " *" : "");
  const x = el("span", "", "total no fiable");
  x.title = "La duración de la foto de Claude Code supera la vida observada de la sesión";
  return x;
}

function pintarTiempos(d) {
  const s = el("section", "", el("h2", "", "Tiempos"));
  s.append(el("h3", "", "Por sesión (las 15 últimas)"));
  s.append(
    tabla(
      [
        { t: "Sesión", v: (t) => el("code", "", t.sesion) },
        { t: "Rama", v: (t) => t.rama ?? "—" },
        { t: "Carpeta", v: (t) => t.carpeta ?? "—" },
        { t: "Último", v: (t) => fFecha(t.ultimo) },
        { t: "Total (última foto)", n: true, v: totalTexto },
        { t: "API", n: true, v: (t) => fMs(t.apiMs) },
        { t: "Herramientas", n: true, v: (t) => fMs(t.herramientasMs) },
        { t: "Hooks", n: true, v: (t) => fMs(t.hooksMs) },
      ],
      d.tiempos,
    ),
  );
  s.append(el("p", "suave", "Total, API, herramientas y coste salen de cost-state: una FOTO esporádica de Claude Code, no un contador final. Hay sesiones sin ninguna, con coste 0 (sin dato), con una foto más larga que la propia sesión (el total sale «total no fiable»; el coste y el resto se conservan) y con la última foto a mitad de sesión (*: hubo mensajes después). Son cifras mínimas, de la sesión entera y no solo de la ventana. Hooks: suma de lo que dejan anotado."));
  s.append(el("h3", "", "Jueces: tiempo desde «lanzado» hasta el informe"));
  const j = d.jueces;
  if (j.tiempos?.length === 0) s.append(el("p", "vacio", "Sin ningún juez con agent_id y las dos anotaciones (lanzado e informe) en esta ventana."));
  else s.append(tabla([{ t: "Cuándo", v: (x) => fFecha(x.ts) }, { t: "Rama", v: (x) => x.rama }, { t: "Juez", v: (x) => x.agente }, { t: "Veredicto", v: (x) => x.veredicto }, { t: "Tardó", n: true, v: (x) => fMs(x.ms) }], j.tiempos));
  return s;
}

function pintarIneficiencias(d) {
  const i = d.ineficiencias;
  const s = el("section", "", el("h2", "", "Ineficiencias"));
  s.append(el("h3", "", "a) Bloqueos de hooks"));
  s.append(el("p", "", `Bloqueos con hook identificado: ${fNum(i.bloqueos?.reduce((n, b) => n + b.n, 0))}.`));
  s.append(
    tabla(
      [
        { t: "Evento", v: (b) => b.evento },
        { t: "Hook", v: (b) => b.nombre },
        { t: "Bloqueos", n: true, v: (b) => fNum(b.n) },
        { t: "Los 3 motivos más repetidos (primeros 80 caracteres)", v: (b) => el("ul", "", ...b.motivos.map((m) => el("li", "", `${m.n} × ${m.texto}`))) },
      ],
      i.bloqueos,
    ),
  );
  s.append(el("p", "suave", "De cada hook solo se listan sus 3 motivos más repetidos, no todos: la suma puede quedarse por debajo de sus bloqueos."));
  s.append(el("h3", "", "b) Jueces relanzados (misma rama y agente, más de un informe distinto)"));
  s.append(tabla([{ t: "Rama", v: (r) => r.rama }, { t: "Juez", v: (r) => r.agente }, { t: "Informes", n: true, v: (r) => fNum(r.informes) }, { t: "Nota", v: (r) => (r.sinAgentId ? `${r.sinAgentId} sin agent_id: pueden ser dobles apuntes del mismo informe` : "") }], i.relanzados));
  s.append(el("h3", "", "c) Coste y tokens"));
  s.append(el("p", "suave", `Coste mínimo (última foto de Claude Code, no un contador final), suma de las sesiones con dato de la ventana: ${fUSD(i.costes?.total)}. Las marcadas con * tuvieron mensajes después de su foto.`));
  s.append(tabla([{ t: "Sesión", v: (c) => el("code", "", c.sesion) }, { t: "Rama", v: (c) => c.rama ?? "—" }, { t: "Carpeta", v: (c) => c.carpeta ?? "—" }, { t: "Coste (mínimo)", n: true, v: (c) => fUSD(c.costeUSD) + (c.fotoAtrasada ? " *" : "") }], i.costes?.sesiones ?? null));
  s.append(el("p", "suave", "Tokens por modelo (mensajes del asistente de la ventana, contados una vez por respuesta):"));
  s.append(tabla([{ t: "Modelo", v: (t) => t.modelo }, { t: "Mensajes", n: true, v: (t) => fNum(t.mensajes) }, { t: "Entrada", n: true, v: (t) => fNum(t.entrada) }, { t: "Salida", n: true, v: (t) => fNum(t.salida) }, { t: "Caché leída", n: true, v: (t) => fNum(t.cacheLeida) }, { t: "Caché creada", n: true, v: (t) => fNum(t.cacheCreada) }], i.tokens));
  s.append(el("h3", "", "d) Subagentes lanzados"));
  s.append(tabla([{ t: "Tipo (herramienta Agent)", v: (a) => a.tipo ?? "sin tipo indicado" }, { t: "Veces", n: true, v: (a) => fNum(a.n) }], i.subagentes));
  s.append(el("p", "suave", `Mensajes del asistente que vienen de subagentes (sidechain): ${fNum(i.mensajesSubagente)}.`));
  return s;
}

function pintarPie() {
  const lista = [
    "Los hooks del proyecto (.claude/settings.json del repo donde corre cada sesión) NO se leen: solo los de ~/.claude/settings.json. Los que salen «no está en ~/.claude/settings.json» sí se han visto activarse.",
    "El registro de jueces del PC lo escribe una versión vieja del hook que también apunta a constructores y lee veredictos falsos: los datos antiguos no son fiables, y este panel no puede separar los buenos de los malos.",
    "Las transcripciones de subagentes que Claude Code guarde en subcarpetas no se leen (SIN COMPROBAR que existan); sí cuentan las que vienen dentro del fichero de la sesión.",
    "No dice si un juez tenía razón ni si el código quedó bien: solo cuántas veces se activó, cuánto tardó y cuánto costó.",
  ];
  return el("section", "", el("h2", "", "Qué NO sabe este panel"), el("ul", "", ...lista.map((x) => el("li", "", x))));
}

// ---- v1: semáforo, En directo y rondas por tarea. Nada se calcula aquí: el nivel, las listas y el null de una fuente caída vienen del servidor ----
const NIVEL = { ok: ["●", "bien"], aviso: ["▲", "atención"], mal: ["■", "mal"], gris: ["◌", "sin dato"] }; // la forma y la palabra, además del color
const VEREDICTO = { pasa: ["✔", "ok", "pasa"], no_pasa: ["✖", "mal", "no pasa"], no_se: ["?", "aviso", "no sé"], sin_veredicto: ["⚠", "gris", "ilegible"] };
const horaMadrid = (() => {
  const f = new Intl.DateTimeFormat("es-ES", { timeZone: "Europe/Madrid", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  return (iso) => f.format(Date.parse(iso));
})();
const hasta = (iso) => msTexto(Math.max(0, Date.now() - Date.parse(iso)));
// Un temporizador: el servidor da la hora de lanzamiento y el navegador sigue contando cada segundo
const crono = (iso) => {
  const e = el("span", "crono", hasta(iso));
  e.dataset.desde = iso;
  return e;
};

function lampara(titulo, nivel, ...detalle) {
  const k = nivel ?? "gris"; // una lámpara sin dato nunca es verde
  return el("div", "lampara " + k, el("span", "forma", NIVEL[k][0]), el("span", "titulo", titulo), el("span", "estado", NIVEL[k][1]), nivel ? el("span", "detalle", ...detalle) : null);
}
function pintarSemaforo(d) {
  const s = d.semaforo;
  const h = s.hooksVivos;
  const b = s.bloqueosHoy;
  const r = s.rondasAbiertas;
  return [
    el(
      "div",
      "luces",
      lampara("Hooks vivos", h?.nivel, ...(h ? [h.ultimo ? ["último evento ", haceEl(h.ultimo)] : "ningún evento visto", ` · ${h.copiaOk ? "copia = repo" : "copia ≠ repo"}`].flat() : [])),
      lampara("Bloqueos hoy", b?.nivel, ...(b ? [`${b.total} ${b.total === 1 ? "bloqueo" : "bloqueos"} desde las 00:00 (${b.identificados} con hook identificado)`] : [])),
      lampara("Rondas abiertas", r?.nivel, ...(r ? [r.n === 0 ? "ninguna" : `${r.n} ${r.n === 1 ? "juez" : "jueces"} sin informe`] : [])),
    ),
  ];
}

// La lista de «En directo» vive entre repintados: las filas nuevas se insertan arriba y las demás no se tocan
function crearDirecto() {
  const msg = el("p", "vacio");
  const ul = el("ul", "directo");
  const nodo = el("section", "", el("h2", "", "En directo"), el("p", "suave", "Hora de Madrid. Lo más nuevo, arriba. La forma y la palabra dicen qué pasó; el color solo ayuda."), msg, ul);
  return { nodo, msg, ul, filas: new Map(), msgTexto: null };
}
function filaDirecta(ev, informe, lanzado) {
  const enlazada = Boolean(informe || lanzado);
  let forma, color, tipo, detalle;
  if (ev.tipo === "agente_lanzado") {
    [forma, color, tipo] = ["▶", "suave", "Agente lanzado"];
    detalle = [ev.agente ?? "(tipo sin indicar)"];
  } else if (ev.tipo === "juez_lanzado") {
    [forma, color, tipo] = ["◆", informe ? VEREDICTO[informe.veredicto]?.[1] ?? "gris" : "aviso", "Juez lanzado"];
    detalle = [ev.agente ?? "juez"];
    if (informe) detalle.push(` · informó a las ${horaMadrid(informe.hora)} · tardó ${fMs(informe.duracionMs)}`);
    else if (ev.agentId) detalle.push(" · en marcha: ", crono(ev.hora));
    else detalle.push(" · sin agent_id (dato antiguo): no se puede seguir");
  } else if (ev.tipo === "juez_informo") {
    const v = VEREDICTO[ev.veredicto] ?? VEREDICTO.sin_veredicto;
    [forma, color, tipo] = [v[0], v[1], "Juez informó"];
    detalle = [`${ev.agente ?? "juez"} · ${v[2]}`];
    if (!ev.agentId) detalle.push(" · sin agent_id (dato antiguo)");
    else if (ev.duracionMs == null) detalle.push(" · duración: sin dato");
    else detalle.push(` · tardó ${msTexto(ev.duracionMs)}`);
    if (lanzado) detalle.push(` · lanzado a las ${horaMadrid(lanzado.hora)}`);
  } else if (ev.tipo === "hook_bloqueo") {
    [forma, color, tipo] = ["■", "mal", "Hook bloqueó"];
    detalle = [ev.hook ?? "hook sin identificar"];
  } else {
    [forma, color, tipo] = ["●", "suave", "Turno terminado"];
    detalle = [`hooks de cierre: ${ev.duracionMs == null ? "sin duración" : msTexto(ev.duracionMs)}`];
  }
  return el("li", `fila ${color}${enlazada ? " enlazada" : ""}`, el("span", "hora", horaMadrid(ev.hora)), el("span", "forma", forma), el("span", "tipo", tipo), el("span", "detalle", ...detalle, ` · sesión ${ev.sesion ?? "?"}`));
}
function actualizarDirecto(d) {
  const z = zonas.dir;
  const ev = d.eventos;
  const texto = ev === null ? "Sin dato en directo (ver franja roja)." : ev.length === 0 ? `Sin actividad en los últimos ${d.directoMin} min.` : "";
  if (texto !== z.msgTexto) {
    z.msg.textContent = texto;
    z.msgTexto = texto;
  }
  const lista = ev ?? [];
  // lo que une un juez lanzado con su informe (mismo agent_id)
  const informes = new Map(lista.filter((x) => x.tipo === "juez_informo" && x.agentId).map((x) => [x.agentId, x]));
  const lanzados = new Map(lista.filter((x) => x.tipo === "juez_lanzado" && x.agentId).map((x) => [x.agentId, x]));
  const vistas = new Map();
  const deseadas = lista.map((x) => {
    const base = JSON.stringify(x);
    const n = vistas.get(base) ?? 0;
    vistas.set(base, n + 1);
    const informe = x.tipo === "juez_lanzado" ? informes.get(x.agentId) : null;
    const lanzado = x.tipo === "juez_informo" ? lanzados.get(x.agentId) : null;
    return { x, clave: `${base}#${n}`, firma: JSON.stringify([informe, lanzado]), informe, lanzado };
  });
  const antes = z.ul.offsetHeight;
  const arriba = z.ul.getBoundingClientRect().top;
  let ref = z.ul.firstChild;
  const nuevas = new Map();
  for (const f of deseadas) {
    const previa = z.filas.get(f.clave);
    if (previa && previa.firma === f.firma) {
      if (previa.li === ref) ref = ref.nextSibling;
      else z.ul.insertBefore(previa.li, ref);
      nuevas.set(f.clave, previa);
      continue;
    }
    if (previa) {
      if (previa.li === ref) ref = ref.nextSibling;
      previa.li.remove();
    }
    const li = filaDirecta(f.x, f.informe, f.lanzado);
    z.ul.insertBefore(li, ref);
    nuevas.set(f.clave, { li, firma: f.firma });
  }
  while (ref) {
    const sig = ref.nextSibling;
    ref.remove();
    ref = sig;
  }
  z.filas = nuevas;
  // Si el usuario mira más abajo, lo que ganó la lista por arriba no le mueve el texto que lee
  const delta = z.ul.offsetHeight - antes;
  if (delta !== 0 && arriba < 0) window.scrollTo(0, window.scrollY + delta);
}

// el coste de la ronda: de la transcripción del juez con ese agent_id; sin transcripción es «sin dato», nunca 0
const costeMarca = (m) => (m.tokens == null ? "coste: sin dato" : m.costeUSD == null ? `${fTok(m.tokens)} tokens · sin precio` : `${fTok(m.tokens)} tokens · ≈ ${fUsd(m.costeUSD)}${m.tokensSinPrecio > 0 ? " (mínimo)" : ""}`);
function marca(m) {
  let forma, color, texto;
  if (m.veredicto === "lanzado") {
    [forma, color, texto] = ["…", m.abierta ? "aviso" : "gris", m.abierta ? "lanzado, en marcha" : "lanzado, sin informe (ya no corre)"];
  } else {
    const v = VEREDICTO[m.veredicto] ?? VEREDICTO.sin_veredicto;
    [forma, color] = [v[0], v[1]];
    texto = v[2] + (m.ms != null ? ` · tardó ${msTexto(m.ms)}` : m.fiable ? " · duración: sin dato" : "") + ` · ${costeMarca(m)}`;
  }
  const completo = `${m.agente} · ${texto}${m.fiable ? "" : " · dato antiguo, no fiable"}`;
  const e = el("span", `marca ${color}${m.fiable ? "" : " antigua"}`, el("span", "forma", forma), m.veredicto === "lanzado" && m.abierta ? crono(m.ts) : null, el("span", "sr", completo));
  e.title = completo;
  return e;
}
function pintarRondas(d) {
  const sal = [el("h2", "", "Rondas por tarea"), el("p", "suave", "Una ronda = un informe de juez en esa rama; no sé a qué PR pertenece. Cada marca es un informe: ✔ pasa · ✖ no pasa · ? no sé · ⚠ ilegible · … lanzado sin informe.")];
  if (d.ramas === null) return [...sal, el("p", "vacio", "No se pudo leer (ver franja roja).")];
  if (!d.ramas.length) return [...sal, el("p", "vacio", `Sin rondas de jueces en los últimos ${d.dias} días.`)];
  return [
    ...sal,
    el(
      "ul",
      "ramas",
      ...d.ramas.map((r) => {
        const antiguas = r.marcas.filter((m) => !m.fiable).length;
        return el(
          "li",
          "rama",
          el("div", "rama-cab", el("code", "", r.rama), el("span", "rama-tot", `${fNum(r.rondas)} ${r.rondas === 1 ? "ronda" : "rondas"} · ${fMs(r.tiempoMs)} en jueces`)),
          el("div", "marcas", ...r.marcas.map(marca)),
          el("p", "suave", r.tokens == null ? "Jueces de esta rama: coste: sin dato (ninguna ronda con transcripción de juez)." : `Jueces de esta rama: ${r.costeUSD == null ? "coste: sin precio" : `coste ≈ ${fUsd(r.costeUSD)}${r.tokensSinPrecio > 0 ? " (mínimo: modelos sin precio no incluidos)" : ""}`} · ${fTok(r.tokens)} tokens · en ${fNum(r.rondasConCoste)} de ${fNum(r.rondas)} rondas.`),
          r.masMarcas ? el("p", "suave", `${r.masMarcas} marcas más antiguas no se enseñan (el total de rondas las cuenta).`) : null,
          antiguas ? el("p", "suave", `${antiguas} ${antiguas === 1 ? "marca" : "marcas"} de dato antiguo, no fiable (sin agent_id: la versión vieja del hook).`) : null,
        );
      }),
    ),
  ];
}

// ---- v1: coste estimado (a precio de API). Nada se calcula aquí: precios, sumas, % y «sin precio» (null) vienen del servidor ----
const AVISO_PLAN = "Si usas un plan con límite de sesión (no pagas por token), esto no es tu factura: mide el consumo relativo (qué parte se va en jueces).";
const CATEGORIAS = [["jueces", "Jueces"], ["otros", "Constructores y otros"], ["principal", "Sesión principal"]];
const SVGNS = "http:" + "//www.w3.org/2000/svg"; // el espacio de nombres de SVG: un identificador, no una petición
const fTok = (n) => (n == null ? SD : n >= 1e6 ? `${(n / 1e6).toFixed(1).replace(".", ",")} M` : n >= 1e3 ? `${(n / 1e3).toFixed(1).replace(".", ",")} k` : String(n));
const fUsd = (n) => (n == null ? SD : n > 0 && n < 0.01 ? "<$0,01" : "$" + n.toFixed(2).replace(".", ","));
const fDia = (dia) => new Date(dia + "T12:00:00Z").toLocaleDateString("es-ES", { day: "numeric", month: "short", timeZone: "UTC" });
const fPct = (n) => (n == null ? "sin precio" : `${nf.format(n)} %`);
// el coste de un cubo { tokens, costeUSD, tokensSinPrecio }: sin precio nunca se pinta como $0, y con modelos sin precio es un mínimo
const textoCoste = (b) => (b.costeUSD === null ? "sin precio" : fUsd(b.costeUSD) + (b.tokensSinPrecio > 0 ? " (mínimo)" : ""));
const textoCubo = (b) => (b == null ? SD : b.tokens === 0 ? "—" : `${fTok(b.tokens)} · ${textoCoste(b)}`);

function svgEl(tag, attrs = {}, ...hijos) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const h of hijos) if (h !== null && h !== undefined) e.append(h);
  return e;
}
// Barras horizontales apiladas por día (legibles a 375 px): cada categoría tiene color Y patrón, y cada día su etiqueta de valor
function grafico(dias) {
  const ETQ = 50, ANCHO = 214, ALTO = 26, ancho = 360;
  const max = Math.max(...dias.map((d) => d.total.costeUSD ?? 0), 1e-9);
  const trazo = { x1: 0, y1: 0, x2: 0, y2: 6, style: "stroke:var(--tarjeta);stroke-width:2.2" };
  const formas = { jueces: () => svgEl("line", trazo), otros: () => svgEl("circle", { cx: 3, cy: 3, r: 1.3, style: "fill:var(--tarjeta)" }), principal: () => svgEl("line", { x1: 0, y1: 3, x2: 6, y2: 3, style: "stroke:var(--tarjeta);stroke-width:1.2" }) };
  const patron = (id) => svgEl("pattern", { id: "patron-" + id, width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, svgEl("rect", { width: 6, height: 6, style: `fill:var(--c-${id})` }), formas[id]());
  const filas = dias.flatMap((d, i) => {
    const y = i * ALTO + 2;
    let x = ETQ;
    const segs = d.total.costeUSD === null ? [] : CATEGORIAS.filter(([k]) => d[k].costeUSD > 0).map(([k, nombre]) => {
      const w = (d[k].costeUSD / max) * ANCHO;
      const r = svgEl("rect", { x, y: y + 3, width: w, height: ALTO - 8, fill: `url(#patron-${k})`, "data-categoria": k, "data-dia": d.dia }, svgEl("title", {}, `${nombre} · ${fDia(d.dia)} · ${textoCoste(d[k])} · ${fTok(d[k].tokens)} tokens`));
      x += w;
      return r;
    });
    return [svgEl("text", { x: 0, y: y + 15 }, fDia(d.dia)), ...segs, svgEl("text", { x: x + 4, y: y + 15 }, d.total.costeUSD === null ? "sin precio" : fUsd(d.total.costeUSD) + (d.total.tokensSinPrecio > 0 ? " (mín.)" : ""))];
  });
  const e = svgEl("svg", { viewBox: `0 0 ${ancho} ${dias.length * ALTO + 4}`, role: "img", "aria-label": "Coste estimado por día, barras apiladas: jueces, constructores y otros, sesión principal. La tabla de debajo trae los mismos números." }, svgEl("defs", {}, patron("jueces"), patron("otros"), patron("principal")), ...filas);
  return el("div", "grafico", e);
}

function tablaCon(titulo, cols, filas) {
  const cab = el("tr", "", ...cols.map((c) => el("th", c.n ? "n" : "", c.t)));
  const cuerpo = filas.map((f) => el("tr", "", ...cols.map((c) => el("td", c.n ? "n" : "", c.v(f)))));
  const caja = el("div", "tabla", el("table", "", el("caption", "suave", titulo), el("thead", "", cab), el("tbody", "", ...cuerpo)));
  caja.tabIndex = 0; // se puede desplazar con el teclado
  return caja;
}

function pintarCoste(d) {
  const c = d.coste;
  const sal = [el("h2", "", "Coste estimado: jueces, constructores y sesión principal")];
  if (c === null) return [...sal, el("p", "vacio", "No se pudo leer (ver franja roja).")];
  sal.push(franja("aviso", c.precios ? `Coste = estimación a precio de API (precios del ${c.precios.fecha}, fuente ${c.precios.fuente}).` : "Coste = estimación a precio de API, pero sin precios: precios.json no se pudo leer. Salen los tokens y el coste dice «sin precio».", [AVISO_PLAN]));
  if (!c.porDia.length) return [...sal, el("p", "vacio", `Sin consumo en los últimos ${d.dias} días.`)];
  const rc = c.repartoCoste;
  const rt = c.repartoTokens;
  sal.push(el("div", "cifras", ...CATEGORIAS.map(([k, nombre]) => el("div", "reparto", `${nombre} ${rc ? fPct(rc[k]) : "sin precio"}`))));
  sal.push(el("p", "suave", `Reparto del coste estimado. Reparto por tokens: ${rt ? CATEGORIAS.map(([k, nombre]) => `${nombre} ${fPct(rt[k])}`).join(" · ") : SD}.`));
  const minimo = c.total.total.tokensSinPrecio > 0 || Boolean(c.modelosSinPrecio?.length);
  sal.push(el("p", "", `Total de los últimos ${d.dias} días: ${textoCubo(c.total.total)}${minimo && c.total.total.costeUSD !== null ? " — mínimo (modelos sin precio no incluidos)" : ""}.`));
  if (c.modelosSinPrecio?.length) sal.push(el("p", "suave", `Modelos sin precio (edita precios.json): ${c.modelosSinPrecio.join(", ")}.`));
  sal.push(c.precios && c.porDia.some((x) => x.total.costeUSD !== null) ? el("div", "", el("div", "leyenda", ...CATEGORIAS.map(([k, nombre]) => el("span", "", el("span", "sw sw-" + k), nombre))), grafico(c.porDia)) : el("p", "vacio", "No se dibuja el gráfico: sin precios no hay coste que comparar (la tabla trae los tokens)."));
  const cols = [{ t: "Día", v: (x) => fDia(x.dia) }, ...CATEGORIAS.map(([k, nombre]) => ({ t: nombre, v: (x) => textoCubo(x[k]) })), { t: "Total", v: (x) => textoCubo(x.total) }];
  sal.push(tablaCon("Coste estimado por día", cols, c.porDia));
  const dato = [{ t: "Tokens", n: true, v: (x) => fTok(x.total.tokens) }, { t: "Coste estimado", n: true, v: (x) => (x.total.costeUSD === null ? "sin precio" : textoCoste(x.total)) }, { t: "% jueces", n: true, v: (x) => fPct(x.pctJueces) }];
  sal.push(tablaCon(`Por sesión (las ${c.porSesion.length} últimas)`, [{ t: "Sesión", v: (x) => el("code", "", x.sesion) }, { t: "Rama", v: (x) => x.rama ?? "—" }, ...dato], c.porSesion));
  sal.push(tablaCon("Por rama (la de la sesión padre)", [{ t: "Rama", v: (x) => x.rama ?? "—" }, ...dato], c.porRama));
  sal.push(el("p", "suave", "Cuenta los mensajes del asistente una vez (por id), de la sesión principal y de cada subagente (ficheros subagents/). Un mensaje de un modelo sin precio da sus tokens y «sin precio». No usa el coste de las fotos (cost-state)."));
  return sal;
}

// ---- Zonas fijas: se crean una vez y cada una se repinta solo si cambió lo suyo ----
const zonas = {};
function crearZonas() {
  zonas.sem = el("section", "semaforo");
  zonas.dir = crearDirecto();
  zonas.ron = el("section", "");
  zonas.cos = el("section", "");
  zonas.resto = el("div", "");
  app.replaceChildren(zonas.sem, zonas.dir.nodo, zonas.ron, zonas.cos, zonas.resto);
}

function pintarResto(d) {
  // Conserva el desplazamiento de la página y de cada tabla, y qué tabla tenía el foco del teclado.
  const cajas = [...zonas.resto.querySelectorAll(".tabla")];
  const izq = cajas.map((c) => c.scrollLeft);
  const foco = cajas.indexOf(document.activeElement);
  const y = window.scrollY;
  zonas.resto.replaceChildren(pintarEstado(d), pintarHooks(d), pintarTiempos(d), pintarIneficiencias(d), pintarPie());
  const nuevas = [...zonas.resto.querySelectorAll(".tabla")];
  if (nuevas.length === izq.length) nuevas.forEach((c, i) => (c.scrollLeft = izq[i]));
  if (foco >= 0 && nuevas[foco]) nuevas[foco].focus({ preventScroll: true });
  window.scrollTo(0, y);
}
// Solo se repinta lo que cambió de verdad; lo que cambia siempre (hora, tiempos de lectura, memoria) se actualiza en su sitio.
const claves = { sem: null, ron: null, cos: null, resto: null };
let saltados = 0;
const vivo = document.getElementById("vivo");
let vivoTs = null;
function marcarVivo(ok, generado) {
  if (generado) vivoTs = generado;
  const forma = ok ? "●" : "■";
  vivo.className = "vivo " + (ok ? "ok" : "mal");
  vivo.replaceChildren(el("span", "forma", forma), ok ? "en vivo · actualizado" : "sin conexión · último dato", vivoTs ? haceEl(vivoTs) : "");
}
function mostrar(d) {
  const { generado, lecturaMs, proceso, ficheros, semaforo, eventos, ramas, coste, ...resto } = d; // lo volátil queda fuera de la comparación
  if (!zonas.sem) crearZonas();
  actualizarDirecto(d); // la lista de En directo es incremental: nunca espera
  if (vivoTs === null || !vivo.className.includes("ok") || vivoTs !== generado) marcarVivo(true, generado);
  const nuevas = { sem: JSON.stringify([semaforo, d.directoMin]), ron: JSON.stringify([ramas, d.dias]), cos: JSON.stringify([coste, d.dias]), resto: JSON.stringify(resto) };
  const cambian = Object.keys(nuevas).filter((k) => nuevas[k] !== claves[k]);
  if (!cambian.length) {
    if (lineaLectura) lineaLectura.textContent = textoLectura(d);
    return;
  }
  const sel = window.getSelection();
  // está seleccionando texto: se espera a que acabe, pero como mucho 6 ciclos (30 s)
  if (sel && !sel.isCollapsed && app.contains(sel.anchorNode) && ++saltados < 6) return;
  saltados = 0;
  for (const k of cambian) claves[k] = nuevas[k];
  if (cambian.includes("sem")) zonas.sem.replaceChildren(...pintarSemaforo(d));
  if (cambian.includes("ron")) zonas.ron.replaceChildren(...pintarRondas(d));
  if (cambian.includes("cos")) zonas.cos.replaceChildren(...pintarCoste(d));
  if (cambian.includes("resto")) pintarResto(d);
}
function pintarFallo(msg, extra) {
  aviso.replaceChildren(franja("mal", msg, extra ? [extra] : null));
  app.classList.add("viejo"); // los datos que quedan son viejos: se atenúan mientras dure la caída
  marcarVivo(false);
}

async function cargar() {
  try {
    const r = await fetch("/datos.json", { cache: "no-store", signal: AbortSignal.timeout(8000) });
    const d = await r.json();
    if (!r.ok || !d.estado) {
      pintarFallo("El panel no pudo calcular los datos.", (d.errores || []).map((x) => `${x.fichero} — ${x.motivo}`).join(" | ") || "HTTP " + r.status);
    } else {
      aviso.replaceChildren();
      app.classList.remove("viejo");
      mostrar(d);
    }
  } catch (e) {
    pintarFallo("No llega al panel local (¿se ha parado servir.mjs?). Lo que ves es lo último que se pudo leer.", e && e.name === "TimeoutError" ? "no respondió en 8 s" : "el navegador no pudo conectar");
  }
}
(function bucle() {
  const sigue = () => setTimeout(bucle, 5000);
  if (document.hidden) return sigue();
  cargar().then(sigue, sigue);
})();
document.addEventListener("visibilitychange", () => { if (!document.hidden) cargar(); });
// «hace N s» y los temporizadores de los jueces en marcha siguen contando en el navegador aunque no lleguen datos nuevos
setInterval(() => {
  document.querySelectorAll("[data-ts]").forEach((n) => (n.textContent = hace(n.dataset.ts)));
  document.querySelectorAll("[data-desde]").forEach((n) => (n.textContent = hasta(n.dataset.desde)));
}, 1000);
</script>
