name: revisor

# Llama al juez reutilizable de la Fábrica (factory-am89/fabrica), fijado a un sha de su main: subirlo es
# un cambio de este fichero y pasa por PR. Corre con pull_request_target: ejecuta la versión de este
# fichero que está en staging, no la del PR. Los secretos (CLAUDE_CODE_OAUTH_TOKEN, REVISOR_CLIENT_ID y
# REVISOR_APP_KEY) viven en el environment `revisor` de este repo. Solo PR a staging.
on:
  pull_request_target:
    branches: [staging]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  revisor:
    uses: factory-am89/fabrica/.github/workflows/revisor.yml@51d3b8e66b3af7286fc66c1e519fa840f29bb79e
    with:
      # Bots de HoMenu que pueden despertar al juez, además de los que ya trae la Fábrica.
      bots: homenu-sesiones,homenu-dependabot-merge
      # Slug de la App revisora propia de HoMenu (paso 4 de PASOS-PABLO.md). Confirmar al crearla.
      revisor-app-slug: homenu-revisor
    # Solo los tres que el juez usa, por nombre y nunca la forma que lo hereda todo (entregaría a un workflow de otro repo todos los secretos
    # de este). Como la plantilla de la Fábrica (apps/proyecto-nuevo/revisor.yml).
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REVISOR_CLIENT_ID: ${{ secrets.REVISOR_CLIENT_ID }}
      REVISOR_APP_KEY: ${{ secrets.REVISOR_APP_KEY }}
