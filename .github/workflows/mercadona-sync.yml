# Sincroniza el catálogo de Mercadona una vez por semana.
#
# ── Por qué aquí y no en un cron de Vercel ────────────────────────────────
# El catálogo es un fichero del repo que se sirve estático (lib/storeCatalog.js
# hace fetch("/store/mercadona.json")). Así que su sitio natural es un commit:
# queda versionado —se ve en el historial cuándo subió el aceite— y no añade ni
# una lectura a Supabase. Servirlo desde la base de datos serían 568 KB por
# usuario y sesión, que es justo el patrón que disparó el egress a 7,4 GB.
#
# Los cron de GitHub corren en la rama por defecto, que es staging: el commit
# cae en staging y llega a producción con el siguiente deploy, como todo lo
# demás. main no recibe nada directo.
#
# ── Sobre la API ──────────────────────────────────────────────────────────
# tienda.mercadona.es/api es NO OFICIAL. Una cosa es lanzarlo a mano de vez en
# cuando y otra convertirlo en tráfico recurrente contra el servidor de otro,
# así que: una vez por semana y punto, con el User-Agent que ya identifica la
# herramienta y las pausas que trae mercadonaFetch.mjs. Nunca a diario.
#
# Y no lleva credenciales de Supabase a propósito: el repo es PÚBLICO, y el
# script se salta ese paso solo cuando no están (mercadona-sync.mjs#42).
#
# ── Cómo llega a staging: un PR, no un push ───────────────────────────────
# Abre un PR a staging con el token de la App homenu-dependabot-merge (puente
# HoMenu, trozo 14; el token de Actions no lanzaría `tests` ni `revisor` sobre
# su PR) y arma la fusión automática: lo fusiona GitHub cuando `tests` y
# `revisor` estén en verde. Si el repo no permite la fusión automática, el job
# falla en alto después de abrir el PR y lo dice. La clave de la App se pide en
# un paso propio, tras `npm ci` y los scripts, para que nada de lo instalado
# llegue a leerla.
#
# Plan B hasta el paso 7 de PASOS-PABLO.md: sin esa clave en este environment,
# empuja con la deploy key (MERCADONA_DEPLOY_KEY) como hasta ahora, para no
# romper el job de cada lunes entre fusionar este cambio y que Pablo guarde la
# clave. Cuando borre la deploy key, otro PR quita ese paso.
#
# Los secretos viven en el environment `mercadona-sync`, que solo admite la rama
# staging: si fuera de repo, cualquier rama podría lanzar su propia versión de
# este workflow (`gh workflow run --ref <rama>`) y sacar la clave. Lanzado desde
# otra rama, el job ni arranca.

name: Sync catálogo Mercadona

on:
  schedule:
    # Lunes a las 06:15 UTC. En punto no: los cron de GitHub se atascan en las
    # horas redondas, cuando arranca medio mundo a la vez.
    - cron: "15 6 * * 1"
  workflow_dispatch: # para poder lanzarlo a mano desde la pestaña Actions
    inputs:
      probar_push:
        description: "Si no hay precios nuevos, abre igualmente un PR con un commit vacío para comprobar el camino entero"
        type: boolean
        default: false

# Solo lo justo para commitear el JSON. Sin esto, el token es de solo lectura.
# (Se queda en write solo por el plan B; el PR va con el token de la App.)
permissions:
  contents: write

concurrency:
  group: mercadona-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # De aquí salen las claves; su política de ramas solo deja staging.
    environment: mercadona-sync
    env:
      # Solo un sí o un no; el valor no sale de aquí. Sin clave de la App, cae el plan B.
      HAY_CLAVE: ${{ secrets.DEPENDABOT_APP_KEY != '' && vars.DEPENDABOT_APP_ID != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Ningún paso hereda el token de Actions en git: cada push lleva el suyo, a la vista.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Sin scripts de instalación (#330): este job escribe en staging con la deploy key
      # y no necesita compilar nada de lo instalado.
      - run: npm ci --ignore-scripts

      - name: Descargar el catálogo
        run: node scripts/mercadona-sync.mjs

      # El guardarraíl que de verdad importa. Si Mercadona cambia su API, el
      # script puede devolver 0 productos —o 40— sin fallar, y entonces esto
      # commitearía un catálogo vacío y lo desplegaría: la lista de la compra se
      # queda sin precios para todo el mundo y nadie se entera.
      #
      # Así que se compara con lo que había: una caída de más del 20% se trata
      # como scraper roto, no como que Mercadona ha dejado de vender comida.
      - name: Comprobar que el catálogo tiene sentido
        run: |
          node -e '
            const { execSync } = require("child_process");
            const nuevo = require("./public/store/mercadona.json");
            const previo = JSON.parse(
              execSync("git show HEAD:public/store/mercadona.json", { maxBuffer: 64e6 }).toString(),
            );
            const antes = previo.productCount, ahora = nuevo.productCount;
            console.log(`productos: ${antes} → ${ahora}`);
            if (ahora < 500) {
              console.error(`❌ Solo ${ahora} productos. El scraper está roto.`);
              process.exit(1);
            }
            if (ahora < antes * 0.8) {
              console.error(`❌ Caída del ${Math.round((1 - ahora / antes) * 100)}%. Revisar antes de publicar.`);
              process.exit(1);
            }
          '

      # El € por ración (derived/recipeCoste.json) sale de estos precios: si no
      # se regenera con ellos, la ficha de una receta de usuario y la del
      # catálogo dejan de medir con la misma vara (lib/coste.test.js lo caza).
      - name: Recalcular el coste por ración
        run: node scripts/build-coste.mjs

      # Abre el PR (puente HoMenu, trozo 14): sustituye al push directo con la deploy key.
      # El commit se hace aquí, en local; el camino (PR o plan B) lo decide el paso siguiente.
      - name: Commitear si ha cambiado algo
        id: commit
        env:
          # En el cron no hay inputs: queda vacío y no prueba nada.
          PROBAR_PUSH: ${{ inputs.probar_push }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/store/mercadona.json; then
            if [ "$PROBAR_PUSH" != "true" ]; then
              echo "Sin cambios: los precios son los mismos que la semana pasada."
              echo "hay=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit --allow-empty -m "chore(mercadona): prueba de PR a staging (sin precios nuevos)"
          else
            N=$(node -p "require('./public/store/mercadona.json').productCount")
            git add public/store/mercadona.json src/data/derived/recipeCoste.json
            git commit -m "chore(mercadona): catálogo semanal — ${N} productos"
          fi

          # Control antes de subir nada (#330): solo sale de aquí lo que este job debe cambiar:
          # como mucho un commit y solo estos dos ficheros. Si no, falla antes de tocar ninguna clave.
          git fetch --no-tags --depth=1 origin staging
          if [ "$(git rev-list --count origin/staging..HEAD)" -gt 1 ]; then
            echo "::error::Más de un commit por subir; no subo."
            exit 1
          fi
          FUERA=$(git diff --name-only origin/staging..HEAD | grep -vxF -e public/store/mercadona.json -e src/data/derived/recipeCoste.json || true)
          if [ -n "$FUERA" ]; then
            echo "::error::El commit toca ficheros que no son del catálogo; no subo."
            echo "$FUERA"
            exit 1
          fi
          echo "hay=true" >> "$GITHUB_OUTPUT"

      # El token de la App se pide aquí, tras `npm ci` y los scripts del repo, para que nada de lo
      # instalado llegue a leerlo. App `homenu-dependabot-merge` (la misma que ya tiene el repo; no se
      # amplía ningún permiso): solo contents y pull-requests, sin workflows. El secreto y la variable
      # se guardan también en este environment (paso 7 de PASOS-PABLO.md).
      - name: Token de la App
        id: app
        if: steps.commit.outputs.hay == 'true' && env.HAY_CLAVE == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPENDABOT_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_KEY }}
          owner: pabloam89
          repositories: MenuPlan
          permission-contents: write
          permission-pull-requests: write

      # Con el token de Actions el PR no lanzaría `tests` ni `revisor`; con el de la App sí.
      - name: Abrir el PR y armar la fusión automática
        if: steps.commit.outputs.hay == 'true' && env.HAY_CLAVE == 'true'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          RAMA="datos/mercadona-semanal-${GITHUB_RUN_ID}"
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${RAMA}"

          ANTES=$(git show origin/staging:public/store/mercadona.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).productCount')
          AHORA=$(node -p "require('./public/store/mercadona.json').productCount")
          CUERPO="$RUNNER_TEMP/cuerpo-pr.md"
          cat > "$CUERPO" <<EOF
          ## Evidence
          - Catálogo semanal de Mercadona: ${ANTES} -> ${AHORA} productos (\`node scripts/mercadona-sync.mjs\`; la comprobación de caída de más del 20 % pasó en este mismo run).
          - Coste por ración recalculado con \`node scripts/build-coste.mjs\`.
          - Solo toca \`public/store/mercadona.json\` y \`src/data/derived/recipeCoste.json\` (comprobado antes de subir la rama).
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ## Decisions
          - Se abre un PR en vez de empujar a staging: lo juzgan \`tests\` y \`revisor\` como cualquier otro cambio.

          ## Not verified
          - Que los precios sean los reales de Mercadona: solo se comprueba el tamaño del catálogo.
          EOF

          PR=$(GH_TOKEN="$APP_TOKEN" gh pr create --base staging --head "$RAMA" --title "chore(mercadona): catálogo semanal — ${AHORA} productos" --body-file "$CUERPO")
          echo "PR abierto: $PR"

          PERMITE=$(GH_TOKEN="$APP_TOKEN" gh api "repos/${GITHUB_REPOSITORY}" --jq .allow_auto_merge)
          if [ "$PERMITE" != "true" ]; then
            echo "::error::El PR ${PR} está abierto, pero el repo no permite la fusión automática (Allow auto-merge): no la armo y nadie lo fusionará solo."
            exit 1
          fi
          GH_TOKEN="$APP_TOKEN" gh pr merge --auto --squash "$PR"

      # Plan B, solo hasta que Pablo guarde la clave de la App en este environment y borre la deploy
      # key (paso 7 de PASOS-PABLO.md); entonces se quita este paso en otro PR. Sin clave de App,
      # el job sigue como antes en vez de romperse.
      - name: Plan B, empujar con la deploy key
        if: steps.commit.outputs.hay == 'true' && env.HAY_CLAVE != 'true'
        env:
          DEPLOY_KEY: ${{ secrets.MERCADONA_DEPLOY_KEY }}
          # Para api.github.com/meta: sin token, 60 llamadas por hora y por IP.
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Sin la clave de la App (DEPENDABOT_APP_KEY) y la variable DEPENDABOT_APP_ID en este environment: no abro PR, uso el plan B."
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::Sin clave de la App ni MERCADONA_DEPLOY_KEY: empujo con el token de Actions. Si staging ya exige tests, GitHub lo rechazará."
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"
            exit 0
          fi

          # La key solo vive en disco lo que dura el push. Las claves de host de
          # GitHub salen de su API por HTTPS, no de un ssh-keyscan a ciegas.
          KEY="$RUNNER_TEMP/mercadona_deploy_key"
          HOSTS="$RUNNER_TEMP/github_known_hosts"
          trap 'rm -f "$KEY"' EXIT
          ( umask 077; printf '%s\n' "$DEPLOY_KEY" > "$KEY" )
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$HOSTS"
          echo "Empujo con la deploy key a $GITHUB_REF_NAME"
          GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOSTS" \
            git push "git@github.com:${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${GITHUB_REF_NAME}"
