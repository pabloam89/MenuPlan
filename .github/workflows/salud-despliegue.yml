# La puerta de salud tras desplegar (#589, norma `vuelta-atras-probada`).
#
# Cada vez que Vercel termina un despliegue de `staging-menuplan` (rama staging) o de
# `Production` (rama main) (evento `deployment_status`), llama a la página y a la guardia de la función del bot del
# despliegue nuevo (scripts/salud-despliegue.mjs). Si algo no responde bien, o Vercel
# lo marcó como fallido, el job sale en ROJO y se abre (o se comenta, sin duplicar) el
# issue «Despliegue sin salud: <rama>». Con el primer despliegue que vuelve a ir bien se comenta y
# se CIERRA ese issue (el siguiente fallo abre uno nuevo).
# - Si una protección de Vercel (login) tapa la respuesta, el resultado es «sin comprobar»: aviso
#   en el run, exit 0, ni abre ni cierra ningún issue.
# El 9 oct 2026 staging desplegó en rojo y nada lo frenó: este es el aviso.
#
# - No revierte nada: avisa. La vuelta atrás es el «Instant Rollback» del panel de Vercel
#   (skill `vercel`, «Vuelta atrás»), y las migraciones no se revierten.
# - Sin secretos ni environment: solo el token del propio workflow, con `issues: write`.
#   La dirección del despliegue es pública. No llama al canario de Lola porque necesita
#   CANARIO_SECRET (environment `vigia`); de eso se encarga el vigía (vigia-lola.yml).
# - Solo los despliegues de Vercel de staging-menuplan (rama staging) y Production (rama main):
#   la preview de un PR o de un fork no pasa por aquí.
# - Nada del evento entra en un `run:`: va por `env:` (la rama sale de un mapa fijo
#   environment -> rama y se vuelve a comprobar en el shell).
# - El script que corre sale de `staging`, no del commit desplegado.
# - Concurrencia: un grupo por environment con cancel-in-progress: false. GitHub deja UN run en
#   cola y descarta los intermedios si llegan varios seguidos: se comprueba el último despliegue,
#   no cada uno.
# - Probarlo a mano: `workflow_dispatch` con la dirección de un despliegue (el estado
#   «success» y la rama que se elija); un fallo se provoca con una dirección que no sea
#   *.vercel.app (sale `url_ilegible`).

name: Salud del despliegue

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Dirección del despliegue (https://….vercel.app)"
        required: true
      rama:
        description: "Rama que se comprueba"
        type: choice
        options: [staging, main]
        default: staging

permissions:
  contents: read

concurrency:
  group: salud-despliegue-${{ github.event.deployment.environment || inputs.rama }}
  cancel-in-progress: false

jobs:
  salud:
    # Solo despliegues de Vercel (creador vercel[bot]) terminados, bien o mal, de los environments
    # staging-menuplan y Production. En esos eventos `deployment.ref` es un SHA, no una rama, y los
    # environments de Actions (vigia, mercadona-sync…) también generan deployment_status con
    # ref staging: por eso se filtra por creador y environment, nunca por ref. Preview (PR y forks) fuera.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment.creator.login == 'vercel[bot]' &&
       contains(fromJSON('["staging-menuplan","Production"]'), github.event.deployment.environment) &&
       contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state))
    env:
      # La rama sale de un mapa fijo environment -> rama, nunca de `ref`.
      RAMA: ${{ inputs.rama || fromJSON('{"staging-menuplan":"staging","Production":"main"}')[github.event.deployment.environment] }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # abrir o comentar el issue del aviso

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: staging
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Comprobar la salud
        id: salud
        env:
          DESPLIEGUE_URL: ${{ github.event.deployment_status.environment_url || inputs.url }}
          DESPLIEGUE_ESTADO: ${{ github.event.deployment_status.state || 'success' }}
          DESPLIEGUE_REF: ${{ env.RAMA }}
          SALUD_HOSTS: ${{ vars.SALUD_HOSTS }}
        # Sale con 1 si algo falla: el job queda en rojo y el paso siguiente avisa.
        run: node scripts/salud-despliegue.mjs --issue "$RUNNER_TEMP/aviso.md"

      - name: Avisar en el issue (sin duplicados)
        if: failure() && steps.salud.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RAMA" in staging|main) ;; *) echo "rama no vigilada"; exit 1 ;; esac
          # Si el script ni llegó a escribir el aviso, se deja uno mínimo.
          [ -s "$RUNNER_TEMP/aviso.md" ] || echo "La puerta de salud falló antes de poder informar (#589)." > "$RUNNER_TEMP/aviso.md"
          printf '\n%s\n' "Run: $RUN_URL" >> "$RUNNER_TEMP/aviso.md"
          titulo="Despliegue sin salud: $RAMA"
          # Autor (el bot) y título EXACTO (#450): la búsqueda de GitHub es difusa y el repo público.
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author "app/github-actions" \
            --search "\"$titulo\" in:title" --json number,title \
            --jq "map(select(.title==\"$titulo\"))[0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/aviso.md"
            echo "Comentado en el issue #$issue"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo" \
              --label "tipo:encargo" --label "area:ops" --assignee pabloam89 \
              --body-file "$RUNNER_TEMP/aviso.md" \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo" \
              --body-file "$RUNNER_TEMP/aviso.md"
          fi

      # Solo con un verde de verdad (no con «sin_comprobar»): comenta y CIERRA el issue. El siguiente
      # fallo abre uno nuevo; así no se comenta en cada despliegue verde.
      - name: Cerrar el aviso si vuelve a ir bien
        if: success() && steps.salud.outputs.salud == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RAMA" in staging|main) ;; *) exit 0 ;; esac
          titulo="Despliegue sin salud: $RAMA"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author "app/github-actions" \
            --search "\"$titulo\" in:title" --json number,title \
            --jq "map(select(.title==\"$titulo\"))[0].number // empty")
          [ -n "$issue" ] || exit 0
          gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment "El último despliegue de \`$RAMA\` pasa la puerta de salud: se cierra. Si vuelve a fallar se abre uno nuevo. Run: $RUN_URL"
