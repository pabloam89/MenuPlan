# Compila la app de iOS y la sube a TestFlight, sin necesitar un Mac propio.
#
# ── Por qué existe ────────────────────────────────────────────────────────
# Firmar una app de iOS solo se puede hacer desde macOS, y aquí nadie tiene
# Mac: la primera build salió del portátil de un familiar. Depender de eso
# significa que cada arreglo —por pequeño que sea— espera a la próxima visita.
# GitHub alquila Macs por build, y como este repo es PÚBLICO esos minutos no
# se cobran, así que el cuello de botella desaparece.
#
# ── Por qué firma manual y no automática ──────────────────────────────────
# La plantilla de Capacitor deja CODE_SIGN_IDENTITY = "iPhone Developer" a
# nivel de proyecto, y con firma automática Xcode acaba pidiendo un perfil de
# DESARROLLO —que exige tener un iPhone registrado— aunque estés archivando
# para la tienda. En una máquina sin dispositivos eso no hay forma de
# satisfacerlo. Con firma manual le decimos exactamente qué perfil y qué
# certificado usar y deja de adivinar. La historia completa está en ios/MAC.md.
#
# ── Qué hay que tener configurado (una sola vez) ──────────────────────────
# En Settings → Secrets and variables → Actions:
#   IOS_DIST_P12_BASE64        certificado de distribución + su clave privada
#   IOS_DIST_P12_PASSWORD      contraseña de ese .p12
#   IOS_PROVISION_PROFILE_BASE64   perfil "HoMenu App Store" del portal
#   APPSTORE_API_KEY_P8_BASE64     clave de la API de App Store Connect
#
# El Key ID, el Issuer ID y las claves de Supabase van aquí en claro a
# propósito: los dos primeros son identificadores inútiles sin el .p8, y las de
# Supabase ya viajan dentro del JavaScript de la web pública. Meterlos como
# secretos daría una falsa sensación de seguridad sin añadir ninguna.

name: iOS → TestFlight

on:
  # Nunca en cada commit: cada ejecución sube una build a TestFlight. Dos formas
  # de lanzarlo a propósito:
  #
  #   · Empujar una etiqueta que empiece por ios-  (git tag ios-1 && git push
  #     origin ios-1). Funciona desde cualquier rama, porque GitHub usa el
  #     workflow de la propia etiqueta.
  #   · El botón de la pestaña Actions. Ese solo aparece cuando este fichero
  #     existe en main — es una limitación de GitHub con workflow_dispatch.
  push:
    tags:
      - "ios-*"
  workflow_dispatch:
    inputs:
      notas:
        description: "Qué cambia en esta build (para acordarse luego)"
        required: false
        default: ""

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  TEAM_ID: 64QZ74Y5M2
  BUNDLE_ID: com.homenu.app
  PROFILE_NAME: HoMenu App Store
  APPSTORE_KEY_ID: 2DD2NWMR54
  APPSTORE_ISSUER_ID: da38af23-d5a3-4d1e-b45f-d90810243b2e
  # Mismos valores que sirve la web en producción (son públicos, ver cabecera).
  VITE_SUPABASE_URL: https://mdzwbrworucnummibxrq.supabase.co
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kendicndvcnVjbnVtbWlieHJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNzgzOTAsImV4cCI6MjA5Nzc1NDM5MH0.2WN6FT9we4EFXOArWIfBEy8m0ufNQJw4MBKHXsMixRU

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # La imagen trae varios Xcode instalados y el que está activo por defecto
      # no siempre es el más nuevo. App Store Connect rechaza builds hechas con
      # SDK antiguos, así que se coge el mayor que haya.
      - name: Usar el Xcode más reciente de la máquina
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web
        run: |
          cat > .env.production.local << EOF
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY
          EOF
          npm run build
          npx cap sync ios

      # Un llavero temporal y propio del runner: así no se toca el del sistema
      # y desaparece con la máquina al terminar.
      #
      # Los logs de Actions solo los puede descargar quien administra el repo,
      # así que los errores se sacan también como anotaciones (::error::), que
      # son públicas: sin eso, un fallo aquí no se puede diagnosticar sin
      # permisos de admin. Nunca se imprime el contenido de un secreto, solo su
      # estado (vacío, no decodifica, tamaño...).
      - name: Preparar el certificado de firma
        # Las variables se llaman igual que los secretos a propósito: así los
        # avisos nombran el secreto que hay que revisar en GitHub.
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          fallo() { echo "::error title=Certificado de firma::$1"; exit 1; }
          [ -n "$IOS_DIST_P12_PASSWORD" ] || fallo "El secreto IOS_DIST_P12_PASSWORD está vacío o no existe (revisa el nombre exacto)."

          P12="$RUNNER_TEMP/dist.p12"
          python3 .github/scripts/decodificar-secreto.py IOS_DIST_P12_BASE64 "$P12" p12

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # La contraseña se prueba tal cual y, si falla, sin el salto de línea
          # o espacios finales que a veces se cuelan al pegarla en GitHub.
          importar() {
            security import "$P12" -k "$KEYCHAIN" -P "$1" -T /usr/bin/codesign -T /usr/bin/security 2>&1
          }
          if ! salida=$(importar "$IOS_DIST_P12_PASSWORD"); then
            recortada="$(printf '%s' "$IOS_DIST_P12_PASSWORD" | sed -e 's/[[:space:]]*$//')"
            if [ "$recortada" != "$IOS_DIST_P12_PASSWORD" ] && salida2=$(importar "$recortada"); then
              echo "::warning title=Certificado de firma::IOS_DIST_P12_PASSWORD tenía espacios o un salto de línea al final; ha funcionado quitándolos. Conviene corregir el secreto."
            else
              fallo "No se pudo importar el .p12: ${salida} — si pone 'MAC verification failed' o 'wrong password', IOS_DIST_P12_PASSWORD no es la contraseña con la que se creó el .p12."
            fi
          fi

          # Sin esto, codesign se queda esperando a que alguien autorice el uso
          # de la clave en un diálogo que en un servidor no va a pulsar nadie.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          identidades="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          echo "$identidades"
          echo "$identidades" | grep -q "Apple Distribution" \
            || fallo "El .p12 se importó, pero no contiene una identidad 'Apple Distribution' válida. Contiene: $(echo "$identidades" | tr '\n' ' ')"
          echo "::notice title=Certificado de firma::Identidad de distribución lista."

      - name: Instalar el perfil de aprovisionamiento
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          fallo() { echo "::error title=Perfil de aprovisionamiento::$1"; exit 1; }

          PERFIL="$RUNNER_TEMP/perfil.mobileprovision"
          python3 .github/scripts/decodificar-secreto.py IOS_PROVISION_PROFILE_BASE64 "$PERFIL" perfil

          # Un perfil es un plist firmado: se desempaqueta para comprobar que es
          # el que el archive va a pedir por nombre, y que no ha caducado.
          security cms -D -i "$PERFIL" > "$RUNNER_TEMP/perfil.plist" 2>/dev/null \
            || fallo "IOS_PROVISION_PROFILE_BASE64 no contiene un perfil de aprovisionamiento válido. ¿Se pegó otro archivo?"
          nombre="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/perfil.plist")"
          caduca="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/perfil.plist")"
          [ "$nombre" = "$PROFILE_NAME" ] \
            || fallo "El perfil guardado se llama '$nombre', pero el archive pide '$PROFILE_NAME'."
          echo "::notice title=Perfil de aprovisionamiento::'$nombre', caduca $caduca."

          # Xcode busca los perfiles en un sitio distinto según la versión, así
          # que se deja en los dos.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PERFIL" "$dir/HoMenu_App_Store.mobileprovision"
          done

      - name: Preparar la clave de App Store Connect
        env:
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          python3 .github/scripts/decodificar-secreto.py APPSTORE_API_KEY_P8_BASE64 \
            "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" p8

      # El número de build tiene que subir en cada envío o App Store Connect
      # rechaza la subida por duplicada. La fecha y hora en UTC cumple eso sola,
      # sin tener que llevar la cuenta en ningún sitio.
      - name: Archivar
        run: |
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Build $BUILD_NUMBER"

          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HoMenu.xcarchive" archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Subir a TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HoMenu.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Build $BUILD_NUMBER"
            echo ""
            echo "${{ inputs.notas }}"
            echo ""
            echo "Tarda unos minutos en aparecer en TestFlight mientras Apple la procesa."
          } >> "$GITHUB_STEP_SUMMARY"
