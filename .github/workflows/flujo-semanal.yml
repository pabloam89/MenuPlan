# Cumplimiento del flujo y salud de las skills, cada semana (#341, fondo #334).
#
# Mide, con `node scripts/cumplimiento.mjs --informe`, lo que el flujo manda y no
# se hace (fondos sin diagnóstico, encargos sin juez, cerrados sin aprendizaje,
# reabiertos por clase mal definida, ciclos por encima de presupuesto) y la salud
# de las skills (higiene, caducidad, medida de nivel 2 desactualizada). Deja el
# informe en un comentario del issue «Flujo: informe semanal».
#
# - Sin secretos, sin Claude y sin coste: solo el token del propio workflow
#   (lee issues, escribe un comentario). NUNCA lanza `skills-prueba` de pago:
#   solo valida los casos (`--ensayo`), y el nivel 2 de pago lo lanza una persona.
# - No abre issues por indicador: un disparo se ve en el informe y una persona lo
#   registra como caso con `npm run issues -- --nuevo` (que busca los parecidos).
#   Abrir uno por run sin esa búsqueda duplicaría (pasó el 8 oct con tres iguales).
# - Repo público: el informe lleva números de issue y vocabulario nuestro, nada
#   que escriba un autor.
# - Dos jobs: `medir` solo lee (issues: read) y `publicar` solo escribe el comentario
#   (issues: write) con el informe que recibe como artefacto; ninguno hace las dos cosas.
# - El issue del informe se localiza por autor (el bot) y título EXACTO: un extraño no puede
#   desviar el comentario abriendo otro con un título parecido. Si la búsqueda FALLA no se
#   crea otro issue (fallar no es «no hay»).
# - Se menciona a una persona solo si aparece un indicador que no disparaba en el comentario anterior.
# - Sin `npm ci`: el script no tiene dependencias.
# - Margen de ruido (#480): `medir` lee los informes anteriores del bot en el mismo issue y cada
#   cifra sale con su vigilante y si su cambio sale del ruido («sin datos suficientes» con pocas semanas).

name: Flujo semanal

on:
  schedule:
    # Lunes 06:55 UTC: después del informe de Lola (06:40) y de los planos (06:50).
    # En punto no: los cron de GitHub se atascan en las horas redondas.
    - cron: "55 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flujo-semanal
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read # solo lee los issues para medir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: staging
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Traer los informes anteriores (para el margen de ruido)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Las cifras de las semanas de antes salen de los comentarios del bot en el issue del informe
          # (solo los suyos, los últimos 26). Si no se pueden leer, el informe sale igual y cada
          # cifra dice «sin datos suficientes»: nunca un «mejoró» sin margen.
          titulo="Flujo: informe semanal"
          : > "$RUNNER_TEMP/historial.txt"
          if issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author "app/github-actions" \
              --search "\"$titulo\" in:title" --json number,title \
              --jq "map(select(.title==\"$titulo\"))[0].number // empty") && [ -n "$issue" ]; then
            gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json comments \
              --jq '[.comments[] | select(.author.login=="github-actions") | .body] | .[-26:] | .[]' > "$RUNNER_TEMP/historial.txt" \
              || echo "::warning::No se pudieron leer los informes anteriores: cada cifra sale «sin datos suficientes»."
          else
            echo "::warning::Sin issue del informe o sin poder buscarlo: cada cifra sale «sin datos suficientes»."
          fi
      - name: Medir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/salida"
          node scripts/cumplimiento.mjs --informe "$RUNNER_TEMP/salida/informe.md" --historial "$RUNNER_TEMP/historial.txt" | tee "$RUNNER_TEMP/lineas.txt"
          # El nivel 2 de las skills SIN llamar a ningún modelo: valida los casos y dice lo que correría.
          # Si los casos no valen, el informe sale igual y lo dice (un run en rojo sin informe no avisa a nadie).
          if ! node scripts/skills-prueba.mjs $(ls .claude/skills) --ensayo > "$RUNNER_TEMP/ensayo.txt" 2>&1; then
            printf '\n%s\n' "Ensayo del nivel 2: FALLA (algún casos.json no vale; mira el log del run)." >> "$RUNNER_TEMP/salida/informe.md"
          fi
          tee -a "$RUNNER_TEMP/lineas.txt" < "$RUNNER_TEMP/ensayo.txt"
          { echo '```'; cat "$RUNNER_TEMP/lineas.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-flujo
          path: ${{ runner.temp }}/salida/informe.md
          retention-days: 7

  publicar:
    needs: medir
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # el comentario del informe (y el issue, la primera vez)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: informe-flujo
          path: ${{ runner.temp }}/salida
      - name: Publicar en el issue
        env:
          GH_TOKEN: ${{ github.token }}
          MENCIONES: ${{ vars.AVISO_MENCIONES || '@pabloam89' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titulo="Flujo: informe semanal"
          informe="$RUNNER_TEMP/salida/informe.md"
          # Autor (el bot) y título EXACTO: la búsqueda de GitHub es difusa y cualquiera puede abrir un issue parecido.
          if ! lista=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author "app/github-actions"               --search "\"$titulo\" in:title" --json number,title               --jq "map(select(.title==\"$titulo\"))[0].number // empty"); then
            echo "::warning::No se pudo buscar el issue del informe; no se crea otro. Queda en el resumen del run."
            exit 0
          fi
          issue="$lista"
          if [ -z "$issue" ]; then
            issue=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo"               --body "Un comentario por semana (.github/workflows/flujo-semanal.yml): cumplimiento del flujo y salud de las skills. Un indicador fuera de umbral se registra como caso con npm run issues -- --nuevo."               | grep -oE '[0-9]+$') || { echo "::warning::No se pudo abrir el issue del informe."; exit 0; }
          fi
          # Indicadores que disparan ahora y los del último comentario del bot (marca oculta): solo se menciona si hay uno nuevo.
          ahora=$(grep -E '^indicador: .* estado: dispara' "$informe" | awk '{print $2}' | sort -u | paste -sd, - || true)
          if previo=$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json comments               --jq '[.comments[] | select(.author.login=="github-actions") | .body] | last // ""'); then
            previo=$(printf '%s' "$previo" | grep -oE 'flujo:dispara=[a-z_,]*' | tail -1 | cut -d= -f2 || true)
            aviso=""
            for id in $(printf '%s' "$ahora" | tr ',' ' '); do
              case ",$previo," in *",$id,"*) ;; *) aviso="$MENCIONES" ;; esac
            done
          else
            aviso="" # sin poder ver el comentario anterior no se menciona: el issue notifica a quien lo sigue
          fi
          printf '%s\n\n<!-- flujo:dispara=%s -->\n%s\n\nRun: %s\n' "$(cat "$informe")" "$ahora" "$aviso" "$RUN_URL" > "$RUNNER_TEMP/comentario.md"
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comentario.md" >/dev/null             && echo "Informe publicado en el issue #$issue"             || echo "::warning::No se pudo publicar el informe"
