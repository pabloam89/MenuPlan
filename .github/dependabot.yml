# Dependabot: avisa de librerías desfasadas o con vulnerabilidades.
#
# Somos dos personas: PR semanales agrupados, contra staging (la rama por
# defecto), y como mucho 3 abiertos a la vez por ecosistema. Cada ecosistema
# en dos grupos (#193):
#   - `*-menores` (parche y menor): los fusiona solo
#     .github/workflows/dependabot-auto.yml cuando `tests` está en verde.
#   - `*-mayores` (mayor): se quedan abiertos para que los mire una sesión.
# Los de actions tocan .github/workflows y el GITHUB_TOKEN no puede fusionarlos:
# los dos grupos de actions los fusiona una sesión.
#
# Los PR de seguridad no esperan al lunes: Dependabot los abre en cuanto sale
# el aviso, uno por librería (también en /dish-gallery, que no está aquí a
# propósito: es una herramienta aparte, parada; ver #193).

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-menores:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-mayores:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-menores:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      actions-mayores:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
