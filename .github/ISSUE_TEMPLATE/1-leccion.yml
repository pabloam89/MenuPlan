# Generado con la clasificación de scripts/lib/issues.mjs: las opciones de los
# desplegables las vigila scripts/issues.test.js.
name: Lección
description: Algo falló o casi falla. Queda abierta hasta que la lección esté en un test, la guardia, un script, una regla o una skill.
title: "[lección] "
labels: ["tipo:leccion"]
body:
  - type: markdown
    attributes:
      value: |
        El repo es **público**: nada de claves, datos de familias ni fallos de seguridad que se puedan aprovechar. Eso va a Pablo en privado.
  - type: input
    id: cuando
    attributes:
      label: Cuándo
      description: Fecha en que pasó (AAAA-MM-DD).
    validations:
      required: true
  - type: textarea
    id: que
    attributes:
      label: Qué pasó
      description: Lo que se esperaba y lo que pasó, en dos o tres frases.
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: El comando y su salida, el PR, el fichero y la línea.
      render: text
  - type: dropdown
    id: causa
    attributes:
      label: Causa
      description: El tipo de fallo. Es lo que luego se cuenta para ver qué falla más.
      options:
        - "vigilante-falso — Un vigilante (guardia, script, CI) bloqueó algo que estaba bien"
        - "vigilante-hueco — Un vigilante dejó pasar algo que estaba mal"
        - "entorno — Lo local no es igual que el CI o que producción (PATH, flags, Windows, red)"
        - "limpieza — Algo automático se quedó a medias sin avisar (carpetas, ramas, crons)"
        - "coordinacion — Sesiones que se pisan, duplican trabajo o pierden un aviso"
        - "modelo-datos — Una tabla, una FK o un dato que no cuadra con su uso"
        - "codigo — Un fallo de lógica en el producto"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      description: La zona donde pasó o donde va el trabajo.
      options:
        - "datos — Esquema, migraciones, Supabase"
        - "lola — El bot"
        - "ui — La app: pantallas e iconos"
        - "catalogo — Recetas, alimentos y nutrición"
        - "motor — Planificador y solver"
        - "ops — Git, CI, hooks, scripts, servicios"
    validations:
      required: true
  - type: dropdown
    id: arreglo
    attributes:
      label: Arreglo
      description: Dónde debería quedar para que no vuelva a pasar. Al cerrar, que sea donde quedó de verdad.
      options:
        - "test — Quedó en un test"
        - "guardia — Quedó en la guardia (.claude/hooks/guardia.mjs)"
        - "script — Quedó en un script que lo comprueba (tarea, retirar, apply-migration…)"
        - "regla — Quedó en CLAUDE.md o en .claude/rules/"
        - "skill — Quedó en un runbook de .claude/skills/"
        - "ninguno — No hace falta, y el issue dice por qué"
    validations:
      required: true
