# Generado con la clasificación de scripts/lib/issues.mjs: las opciones de los
# desplegables las vigila scripts/issues.test.js.
name: "Decisión"
description: "Algo que tiene que decidir Pablo (o Álvaro). Recomendación primero, en llano."
title: "[decisión] "
labels: ["tipo:decision"]
body:
  - type: markdown
    attributes:
      value: |
        El repo es **público**: nada de claves, datos de familias ni fallos de seguridad que se puedan aprovechar. Eso va a Pablo en privado.
  - type: textarea
    id: pregunta
    attributes:
      label: "Pregunta"
      description: "Qué hay que decidir, en una frase que se entienda sin saber programar."
    validations:
      required: true
  - type: textarea
    id: opciones
    attributes:
      label: "Opciones y recomendación"
      description: "Cada opción con lo que pasa si se elige. La recomendada, primero."
    validations:
      required: true
  - type: textarea
    id: sin-decidir
    attributes:
      label: "Qué pasa si no se decide"
      description: "Qué se queda parado o empeora mientras tanto."
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: "Área"
      description: "La zona donde pasó o donde va el trabajo."
      options:
        - "datos — Esquema, migraciones, Supabase"
        - "lola — El bot"
        - "ui — La app: pantallas e iconos"
        - "catalogo — Recetas, alimentos y nutrición"
        - "motor — Planificador y solver"
        - "ops — Git, CI, hooks, scripts, servicios"
    validations:
      required: true
