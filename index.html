<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#2d5a3d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- «default» y no «black-translucent»: con translúcida, instalada en iPhone,
         la app se pintaba debajo de la hora y la batería (sin viewport-fit=cover
         el margen seguro vale 0 y nada lo compensaba). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HoMenu" />
    <!-- `viewport-fit=cover` va aqui, fijo, y no se toca en tiempo de ejecucion:
         es lo unico que hace que los `env(safe-area-inset-*)` dejen de valer 0.
         En la app iOS (Capacitor) la web se dibuja de borde a borde y es el CSS
         de cada cabecera, con safeTop() (ui.jsx), el que aparta el contenido del
         reloj y del indicador de inicio con el hueco REAL de cada iPhone. En el
         navegador, y en la PWA con la barra «default», los insets valen 0 y no
         cambia nada. Sin maximum-scale ni user-scalable=no: el zoom se deja. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <title>HoMenu</title>
    <!-- Inicio se pinta aquí, antes de que llegue el código de la app. Solo a
         quien tiene sesión o familia en este dispositivo: a quien llega nuevo le
         toca la portada. Fuera de los tokens porque estos cargan con la app;
         marca.test.js ata la clave y el degradado a su sitio. -->
    <script>
      try {
        var conFamilia = /"members":\[\{/.test(localStorage.getItem("menuplan.state.v1") || "");
        // Vuelta del login o llave de Lola: la sesión llega en la dirección.
        var entrando = /[#?&](access_token|code|entrar)=/.test(location.search + location.hash);
        if (conFamilia || entrando || Object.keys(localStorage).some(function (k) { return /^sb-.*-auth-token$/.test(k); })) {
          document.documentElement.classList.add("con-casa");
        }
      } catch (e) {
        console.warn("[arranque] sin esqueleto: no se pudo leer el dispositivo", e);
      }
    </script>
    <style>
      html:not(.con-casa) #root > .esq { display: none; }
      .esq {
        display: flex; flex-direction: column; gap: 16px; box-sizing: border-box;
        width: 100%; max-width: 420px; min-height: 100dvh; margin: 0 auto;
        padding: calc(32px + env(safe-area-inset-top)) 24px 0;
        background: linear-gradient(165deg, #e3f5e9 0%, #fbf3d9 45%, #fce6d1 65%, #fde3d3 100%);
      }
      .esq-b { background: rgba(45, 90, 61, .1); border-radius: 12px; animation: esq-pulso 1.4s ease-in-out infinite; }
      .esq-saludo { width: 62%; height: 28px; }
      .esq-avatares { display: flex; justify-content: center; padding: 8px 0 24px; }
      .esq-avatar { width: 56px; height: 56px; border-radius: 50%; margin: 0 -5px; }
      .esq-tarjeta { height: 72px; border-radius: 20px; }
      .esq-banner { height: 104px; border-radius: 20px; }
      .esq-linea { width: 45%; height: 18px; }
      .esq-nav { margin: auto -24px 0; height: 80px; border-radius: 24px 24px 0 0; background: #fff; }
      @keyframes esq-pulso { 50% { opacity: .5; } }
      @media (prefers-reduced-motion: reduce) { .esq-b { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="esq">
        <div class="esq-b esq-saludo"></div>
        <div class="esq-avatares">
          <div class="esq-b esq-avatar"></div>
          <div class="esq-b esq-avatar"></div>
          <div class="esq-b esq-avatar"></div>
        </div>
        <div class="esq-b esq-tarjeta"></div>
        <div class="esq-b esq-banner"></div>
        <div class="esq-b esq-linea"></div>
        <div class="esq-nav"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
